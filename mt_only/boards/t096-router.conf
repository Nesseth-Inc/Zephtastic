# SPDX-License-Identifier: GPL-3.0-only
# Standalone router image, using t096.overlay and the 680 KiB fresh-domain layout.
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_LORA=y
CONFIG_LORA_MODULE_BACKEND_NATIVE=y
CONFIG_LORA_SX126X_NATIVE_SLEEP=n
CONFIG_LORA_SHELL=n
CONFIG_HWINFO=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_NETWORKING=n
CONFIG_WIFI=n
CONFIG_PM=n
CONFIG_PM_DEVICE=n
CONFIG_LOG=n
CONFIG_ASSERT=y
CONFIG_WATCHDOG=y
CONFIG_REBOOT=y
CONFIG_SHELL=n
CONFIG_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_LTO=n
CONFIG_RING_BUFFER=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="ZephTastic ZT"
CONFIG_REGULATOR=y
CONFIG_ADC=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_NRF_APPROTECT_USE_UICR=n
CONFIG_STACK_USAGE=y
CONFIG_ASSERT_MODULE_DEFAULT_LEVEL_TERSE=y
CONFIG_POWEROFF=y
CONFIG_MT_T096_ROUTER_ONLY=y
CONFIG_MT_ALLOW_TX=y
CONFIG_MT_NORMAL_ENDPOINT=y
CONFIG_MT_NORMAL_TX_DEFAULT=y
CONFIG_MT_T096_OWNER_TX=y
CONFIG_MT_PKI_STOCK_TRIAL=y
CONFIG_MT_DISPLAY=n
CONFIG_MT_GNSS_T096=n
CONFIG_MT_ENVIRONMENT_SENSORS=n
CONFIG_MT_ACCESSORY_SENSORS=n
CONFIG_MT_TAK_TRACKER=n
CONFIG_BT=n
CONFIG_ENTROPY_NRF5_BIAS_CORRECTION=y
