CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="ZephTastic ZT"
CONFIG_REGULATOR=y
CONFIG_ADC=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_NRF_APPROTECT_USE_UICR=n

# One 251-byte ACL payload carries a complete 247-byte ATT PDU. Keep all
# 29 prepared-write buffers: at MTU 23 each contains at most 18 value bytes,
# so a single maximum 512-byte ToRadio transaction still fits before Execute.
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# Keep the existing radio/controller data-length limit. L2CAP handles segmentation.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=27

# Same RGB565 output, ten bounded strips; saves 2,560 B versus 16 rows.
CONFIG_MT_UI_STRIP_ROWS=8
# Compiler-only per-function stack reports; no runtime instrumentation.
CONFIG_STACK_USAGE=y

# Reuse the board GNSS/NMEA driver on UART0. Manual PM only.
CONFIG_GNSS=y
CONFIG_GNSS_NMEA_GENERIC=y
CONFIG_GNSS_SATELLITES=n
CONFIG_GNSS_DUMP=n
CONFIG_GNSS_DUMP_TO_LOG=n
CONFIG_MODEM_CHAT_LOG_RAW_RX=n
CONFIG_MODEM_DEDICATED_WORKQUEUE=n
CONFIG_UART_ASYNC_API=n
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_SYSTEM_MANAGED=n
CONFIG_PM_DEVICE_RUNTIME=n

# Keep every default assertion predicate and fatal path; omit file/line strings
# on the flash-constrained T096. This is diagnostics only, not ASSERT=n.
CONFIG_ASSERT_MODULE_DEFAULT_LEVEL_TERSE=y
CONFIG_POWEROFF=y
