CONFIG_MT_RF_ADMIN_GET=y
CONFIG_MT_PKI_COMPACT_RUNTIME_ONLY=n
CONFIG_MT_PKI_EXTENDED_DIAGNOSTICS=y
CONFIG_MT_BROWSER_MESSAGING=y
