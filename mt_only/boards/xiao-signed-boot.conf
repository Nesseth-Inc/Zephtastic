CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
CONFIG_BOOT_ECDSA_TINYCRYPT=y
CONFIG_BOOT_SWAP_USING_SCRATCH=y
# Both slots and scratch are aligned to the ESP flash's 64 KiB block erase.
# Keep the physical page map for ordered trailer erasure and verify geometry.
CONFIG_MCUBOOT_LOGICAL_SECTOR_SIZE=0x10000
CONFIG_MCUBOOT_VERIFY_LOGICAL_SECTORS=y
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
CONFIG_BOOT_VERSION_CMP_USE_BUILD_NUMBER=y
CONFIG_BOOT_MAX_IMG_SECTORS_AUTO=n
CONFIG_BOOT_MAX_IMG_SECTORS=448
CONFIG_MCUBOOT_LOG_LEVEL_OFF=y
CONFIG_MCUBOOT_SERIAL=n
CONFIG_BOOT_USB_DFU=n
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
