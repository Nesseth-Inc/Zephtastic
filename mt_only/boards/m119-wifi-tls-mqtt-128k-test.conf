# M119 temporary test overlay. Combine only with the pinned M118 WiFi/MQTT
# board profile; no network credentials or broker values belong in this file.
# It deliberately selects the one 128 KiB candidate and the default-off test
# hook. Production/T096/ordinary-XIAO configs must not include this overlay.
CONFIG_MT_M119_TLS_TEST=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_ESP_MBEDTLS_HEAP_ALLOC_EXT_RAM=y
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOTS=y
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=16
CONFIG_MBEDTLS_HEAP_SIZE=131072
