CONFIG_ESP_SIMPLE_BOOT=y
CONFIG_STACK_SENTINEL=y
CONFIG_POWEROFF=y
# XIAO only: static ELF audit found 11,888 B on the largest audited nested
# initialization path; 8 KiB was insufficient. T096 keeps its own profile.
CONFIG_MAIN_STACK_SIZE=16384
# Concurrent USB, BLE and network load touched 1,332 of the aligned 1,408
# bytes in BT_LW_WQ. Reserve 2 KiB for the secure Bluetooth workqueue.
CONFIG_BT_LONG_WQ_STACK_SIZE=2048
# ZT installs the per-connection PIN and bonding policy before requesting
# encryption. A restored GATT subscription must not start it earlier.
CONFIG_BT_GATT_AUTO_SEC_REQ=n
