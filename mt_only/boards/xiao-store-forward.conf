# M135 opt-in overlay, layered after the private WiFi/128K TLS profile.
# Static capability only; the persisted module remains disabled by default.
CONFIG_MT_ALLOW_TX=y
CONFIG_MT_NORMAL_TX_DEFAULT=y
CONFIG_MT_STORE_FORWARD_PSRAM=y
# Retain the independently qualified external TLS heap composition.
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_ESP_MBEDTLS_HEAP_ALLOC_EXT_RAM=y
CONFIG_MBEDTLS_HEAP_SIZE=131072
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOTS=y
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=16
CONFIG_MT_M119_TLS_TEST=n
