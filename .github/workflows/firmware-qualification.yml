name: Firmware qualification
on:
  push:
    branches: [main, codex/upstream-private-ci]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  qualify:
    name: Qualify ${{ matrix.group }}
    runs-on: [self-hosted, Linux, X64, generic-build]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [native, nordic, esp32]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Run qualification
        shell: bash
        env:
          BUILD_GROUP: ${{ matrix.group }}
        run: bash mt_only/scripts/ci-qualify.sh "$BUILD_GROUP"
